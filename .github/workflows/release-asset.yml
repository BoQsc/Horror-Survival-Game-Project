name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot (Mono/C#)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true 

      - name: Install Mesa and Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 mesa-utils xvfb

      - name: Patch Project Settings (Unlock GLSL)
        # We MUST be in forward_plus for Godot to even attempt GLSL imports.
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/rendering_method.mobile="gl_compatibility"/rendering_method.mobile="forward_plus"/g' project.godot

      - name: Smart Shader Importer Assignment
        # Manually ensures the .import files are set to 'rd_shader' for compute files.
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "✅ Found Compute Shader: $f. Forcing RDShader importer."
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            fi
          done

      - name: Import Assets (Bypass Headless Block)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # We use xvfb-run WITHOUT --headless to bypass the 4.3 import restriction.
          # We use --rendering-driver vulkan to allow SPIR-V compilation.
          xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --import --path . || true

      - name: Finalize Metadata (Virtual GUI Mode)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # Second pass in virtual GUI mode to finalize UIDs and internal .godot paths.
          timeout 60s xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --editor --quit --path . || true

      - name: Verify SPIR-V Generation
        # Critical check: Ensures .res files actually exist in the imported folder.
        run: |
          echo "--- Checking .godot/imported for compiled shader binaries ---"
          find .godot/imported/ -name "*.res" | xargs du -h || echo "❌ No compiled shaders found!"

      - name: Package Asset
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: "Bypassed headless GLSL block using Xvfb and Software Vulkan (Lavapipe)."
          files: pre_imported_asset.zip
