name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      # Moving to the 4.6 Docker image
      image: barichello/godot-ci:4.6
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Patch Project Settings
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/renderer\/rendering_device\/driver.windows=.*/renderer\/rendering_device\/driver.windows="vulkan"/g' project.godot

      - name: Smart Shader Importer Assignment
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "Assigning RDShader importer: $f"
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            fi
          done

      - name: Full Import Pass
        run: |
          # 4.6 handles headless compute imports much better
          apt-get update && apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
          xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --import --path . || true

      - name: Verify Binary Persistence
        run: |
          echo "--- Checking compiled artifacts ---"
          find .godot/imported/ -name "*.res" | xargs du -h

      - name: Package Asset (Complete .godot Folder)
        run: |
          apt-get update && apt-get install -y zip
          # We include the entire .godot folder BUT exclude the transient editor UI state
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*"
          
      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build (Godot 4.6)"
          files: pre_imported_asset.zip
