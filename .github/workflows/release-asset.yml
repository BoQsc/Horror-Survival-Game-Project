name: "Continuous Pre-Imported Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot (Mono/C#)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true 

      - name: Headless Import (Shader Pass)
        # Using opengl3 forces the engine to initialize a software rendering device 
        # that can compile GLSL shaders without a physical GPU.
        run: |
          godot --headless --audio-driver Dummy --rendering-driver opengl3 --import --path . || true

      - name: Headless Editor (Metadata Pass)
        # This pass generates the .godot/imported/ folder and uid_cache.
        # We give it a 60s timeout to prevent hanging.
        run: |
          timeout 60s godot --headless --audio-driver Dummy --rendering-driver opengl3 --editor --quit --path . || true

      - name: Package Asset
        # This zip command ensures we take the imported data but leave your local editor junk.
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: "This build includes the pre-imported .godot folder for instant setup."
          files: pre_imported_asset.zip
