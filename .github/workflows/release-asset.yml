name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot (Mono/C#)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true 

      - name: Install Mesa and Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 mesa-utils xvfb

      - name: Patch Project Settings (Force Forward+)
        # We MUST be in forward_plus or mobile to allow GLSL/Compute imports.
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/rendering_method.mobile="gl_compatibility"/rendering_method.mobile="forward_plus"/g' project.godot

      - name: Smart Shader Importer Assignment
        # Ensures Godot treats the files as RDShaderFile (Compute) rather than Text.
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "✅ Found Compute Shader: $f. Forcing RDShader importer."
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            fi
          done

      - name: Import Assets (Xvfb + Software Vulkan)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          # VK_ICD_FILENAMES points to Lavapipe, the software Vulkan implementation
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # 1. We use xvfb-run to bypass the 'headless' block on GLSL imports.
          # 2. We use --rendering-driver vulkan because OpenGL cannot compile RDShaders.
          xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --import --path . || true

      - name: Finalize Metadata (Xvfb + Software Vulkan)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # Second pass to finalize UIDs and directory structure.
          timeout 60s xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --editor --quit --path . || true

      - name: Verify SPIR-V Generation
        # This step helps us see in the logs if the shaders actually compiled.
        run: |
          echo "Checking for compiled shader artifacts..."
          find .godot/imported/ -name "*.res" -o -name "*.spirv" || echo "No compiled shaders found!"

      - name: Package Asset
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: "Smart build utilizing Xvfb and Lavapipe for SPIR-V shader compilation."
          files: pre_imported_asset.zip
