name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot (Mono/C#)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true 

      - name: Install Mesa Software Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 mesa-utils

      - name: Patch Project Settings (Unlock GLSL Compiler)
        # GLSL Compute Shaders are blocked in 'gl_compatibility' mode. 
        # We temporarily switch to 'forward_plus' to allow the engine to import them.
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/rendering_method.mobile="gl_compatibility"/rendering_method.mobile="forward_plus"/g' project.godot

      - name: Smart Shader Importer Assignment
        # Automatically fixes .import files for any GLSL containing the #[compute] tag.
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "✅ Found Compute Shader: $f. Forcing RDShader importer."
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            else
              echo "ℹ️ Skipping $f (No compute tag found)."
            fi
          done

      - name: Headless Import (Vulkan Software Pass)
        # We use Vulkan here because it is the native language of RDShaders
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          godot --headless --audio-driver Dummy --rendering-driver vulkan --import --path . || true

      - name: Headless Editor (Metadata Finalization)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # Generates UIDs and finalizes the .godot directory structure
          timeout 60s godot --headless --audio-driver Dummy --rendering-driver vulkan --editor --quit --path . || true

      - name: Revert Project Settings (Back to Compatibility)
        # We restore the original rendering method before zipping so the user's settings are preserved.
        run: |
          sed -i 's/rendering_method="forward_plus"/rendering_method="gl_compatibility"/g' project.godot
          sed -i 's/rendering_method.mobile="forward_plus"/rendering_method.mobile="gl_compatibility"/g' project.godot

      - name: Package Asset
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: "Smart build: Project was temporarily promoted to Forward+ to compile SPIR-V shaders, then reverted."
          files: pre_imported_asset.zip
