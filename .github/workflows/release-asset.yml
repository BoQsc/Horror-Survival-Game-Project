name: "Continuous Pre-Imported Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          # Using .mono. version since your logs show you are using the Mono/C# version
          version: 4.3.0 
          use-dotnet: true 

      - name: Headless Import (Warm-up)
        # We use --import first. This is less "picky" than --editor.
        # || true ensures the workflow doesn't stop if Godot throws minor errors.
        run: |
          godot --headless --audio-driver Dummy --import --path . || true

      - name: Headless Editor (Finalize)
        # This second pass generates the uid_cache and finalizes metadata.
        # We give it a timeout so it doesn't hang if it loops.
        run: |
          timeout 60s godot --headless --audio-driver Dummy --editor --quit --path . || true

      - name: Package Asset
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: "Includes pre-imported .godot folder. Built on $(date)."
          files: pre_imported_asset.zip
