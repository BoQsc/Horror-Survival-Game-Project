name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: # This enables the "Run workflow" button in the Actions tab

jobs:
  build-and-release:
    # Allows manual runs OR pushes to the default branch
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Smart Shader Importer Assignment
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "✅ Found Compute Shader: $f. Forcing RDShader importer."
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            fi
          done

      - name: Patch Project for Import
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/rendering_method.mobile="gl_compatibility"/rendering_method.mobile="forward_plus"/g' project.godot

      - name: Import Assets (Bypass Headless Restriction)
        run: |
          apt-get update && apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers libfontconfig1 libxcursor1 libxinerama1 libxrandr2 libxi6
          xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --import --path .

      - name: Finalize Metadata (Virtual GUI Mode)
        run: |
          timeout 60s xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --editor --quit --path . || true

      - name: Verify SPIR-V Generation
        run: |
          echo "--- Verifying compiled shader binaries ---"
          if [ -d ".godot/imported" ]; then
            find .godot/imported/ -name "*.res" | xargs du -h || (echo "❌ No .res files found!" && exit 1)
          else
            echo "❌ ERROR: .godot/imported directory does not exist!"
            exit 1
          fi

      - name: Set Final Project Configuration
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          if grep -q "rendering/renderer/rendering_device/driver.windows" project.godot; then
            sed -i 's/rendering\/renderer\/rendering_device\/driver.windows=.*/rendering\/renderer\/rendering_device\/driver.windows="vulkan"/g' project.godot
          elif grep -q "\[rendering\]" project.godot; then
            sed -i '/\[rendering\]/a renderer/rendering_device/driver.windows="vulkan"' project.godot
          else
            echo -e '\n[rendering]\nrenderer/rendering_device/driver.windows="vulkan"' >> project.godot
          fi

      - name: Package Asset
        run: |
          apt-get update && apt-get install -y zip
          zip -r hsg-pre_imported_asset.zip . .godot \
          -x "*.git*" ".github/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: |
            **Automated Build Details:**
            - **Trigger:** ${{ github.event_name }}
            - **Shaders:** Pre-compiled SPIR-V (Compute) binaries included in `.godot/`.
            - **Renderer:** Forced to **Forward+ (Vulkan)** for compute compatibility.
            - **CI Method:** Xvfb-GUI (with fix for missing X11 libs).
          files: |
            hsg-pre_imported_asset.zip
