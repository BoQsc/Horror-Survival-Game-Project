name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot (Mono/C#)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true 

      - name: Install Mesa and Virtual Display
        # We install xvfb to provide a virtual windowing system
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 mesa-utils xvfb

      - name: Patch Project Settings (Unlock GLSL)
        # We temporarily promote the project to Forward+ so Godot allows GLSL imports
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/rendering_method.mobile="gl_compatibility"/rendering_method.mobile="forward_plus"/g' project.godot

      - name: Smart Shader Importer Assignment
        # Automatically identifies compute shaders by their content
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "✅ Found Compute Shader: $f. Forcing RDShader importer."
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            fi
          done

      - name: Import Assets (Virtual Display + Software GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # We use opengl3 as the display driver to avoid Vulkan Surface errors in Xvfb
          # but the software GPU still handles the SPIR-V compilation.
          xvfb-run godot --audio-driver Dummy --rendering-driver opengl3 --import --path . || true

      - name: Finalize Metadata (Virtual Display)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          # Give Godot 60 seconds to finish generating UIDs and internal metadata
          timeout 60s xvfb-run godot --audio-driver Dummy --rendering-driver opengl3 --editor --quit --path . || true

      - name: Package Asset
        # Zips the project including the .godot folder, excluding local editor junk
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: |
            **Automated Build Details:**
            - **Rendering:** Forward+ (Patched for import)
            - **Shaders:** Pre-compiled SPIR-V binaries included
            - **Metadata:** .godot folder initialized for instant loading
          files: pre_imported_asset.zip
