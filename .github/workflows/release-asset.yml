name: "Continuous Pre-Imported Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot (Mono/C#)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true 

      - name: Install Mesa Software Drivers
        # This installs the software-based OpenGL/Vulkan drivers for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1-mesa

      - name: Headless Import (Force Software GPU)
        env:
          # These two variables tell the OS: "Do not look for a hardware GPU, use the CPU to render."
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: |
          # We use opengl3 because it is most compatible with software rendering
          godot --headless --audio-driver Dummy --rendering-driver opengl3 --import --path . || true

      - name: Headless Editor (Final Pass)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
        run: |
          # Second pass to ensure metadata/UIDs are finalized with the "GPU" active
          timeout 60s godot --headless --audio-driver Dummy --rendering-driver opengl3 --editor --quit --path . || true

      - name: Package Asset
        run: |
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*" ".godot/editor/*" ".godot/shader_cache/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          files: pre_imported_asset.zip
