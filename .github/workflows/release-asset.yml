name: "Continuous Smart Asset Release"

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Smart Shader Importer Assignment
        # Identifies Compute Shaders and forces the rd_shader importer metadata
        run: |
          for f in $(find . -name "*.glsl"); do
            if grep -q "#\[compute\]" "$f" || [[ "$f" == *".compute.glsl" ]]; then
              echo "✅ Found Compute Shader: $f. Forcing RDShader importer."
              echo '[remap]
          importer="rd_shader"
          type="RDShaderFile"' > "${f}.import"
            fi
          done

      - name: Patch Project for Import
        # Temporarily force Forward+ so Godot allows the GLSL compiler to run
        run: |
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          sed -i 's/rendering_method.mobile="gl_compatibility"/rendering_method.mobile="forward_plus"/g' project.godot

      - name: Import Assets (Bypass Headless Restriction)
        # We use xvfb-run inside the container to avoid the "Headless GLSL" block
        run: |
          apt-get update && apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
          xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --import --path . || true

      - name: Finalize Metadata (Virtual GUI Mode)
        run: |
          timeout 60s xvfb-run --server-args="-screen 0 1024x768x24" \
            godot --audio-driver Dummy --rendering-driver vulkan --editor --quit --path . || true

      - name: Verify SPIR-V Generation
        run: |
          echo "--- Verifying compiled shader binaries ---"
          find .godot/imported/ -name "*.res" | xargs du -h || echo "❌ No compiled shaders found!"

      - name: Set Final Project Configuration
        # Lock the project to Vulkan/Forward+ before packaging
        run: |
          # 1. Ensure method is Forward+
          sed -i 's/rendering_method="gl_compatibility"/rendering_method="forward_plus"/g' project.godot
          # 2. Force Windows driver to Vulkan (overwrites D3D12 fallbacks from CI logs)
          if grep -q "rendering/renderer/rendering_device/driver.windows" project.godot; then
            sed -i 's/rendering\/renderer\/rendering_device\/driver.windows=.*/rendering\/renderer\/rendering_device\/driver.windows="vulkan"/g' project.godot
          else
            echo '' >> project.godot
            echo '[rendering]' >> project.godot
            echo 'renderer/rendering_device/driver.windows="vulkan"' >> project.godot
          fi

      - name: Package Asset
        run: |
          apt-get update && apt-get install -y zip
          zip -r pre_imported_asset.zip . \
          -x "*.git*" ".github/*"

      - name: Update Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Latest Pre-Imported Build"
          body: |
            **Automated Build Details:**
            - **Shaders:** Pre-compiled SPIR-V (Compute) binaries included.
            - **Renderer:** Forced to **Forward+ (Vulkan)** for compute compatibility.
            - **CI Method:** Xvfb-GUI Bypass (Godot 4.3).
          files: pre_imported_asset.zip
